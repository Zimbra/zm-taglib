version: 2.1

jobs:
  build_and_publish_jar:
    working_directory: ~/zm-taglib
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout

      - run:
          name: Pull build image
          command: |
            echo "$DOCKER_PASS" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USER" --password-stdin
            docker pull "$DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04"

      - run:
          name: Clone dependencies
          command: |
            git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
            git clone -b ZCS-18799 --single-branch https://github.com/Zimbra/zm-zcs.git ~/zm-zcs
            git clone -b ZCS-18799 --single-branch https://github.com/Zimbra/zm-mailbox.git ~/zm-mailbox

      - run:
          name: Build JAR only
          command: |
            docker run --rm \
              -v ~/zm-mailbox:/home/build/zm-mailbox \
              -v /home/build/.ivy2:/home/build/.ivy2 \
              -w /home/build/zm-mailbox \
              "$DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04" \
              bash -c "export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 && ant clean publish-local"

      - run:
          name: Publish to Nexus
          command: |
            docker run --rm \
              -v ~/zm-mailbox:/home/build/zm-mailbox \
              -v /home/build/.ivy2:/home/build/.ivy2 \
              -w /home/build/zm-mailbox \
              "$DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04" \
              bash -c "ant publish-remote -Dresolver=nexus -Dbuild.number=$CIRCLE_BUILD_NUM"

workflows:
  version: 2
  build_and_publish:
    jobs:
      - build_and_publish_jar:
          context:
            - docker-dev-registry
          filters:
            branches:
              only:
                - poc
