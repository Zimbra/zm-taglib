version: 2.1

############################################################################

references:
   checkout_job_steps: &checkout_job_steps
      steps:
         - checkout
         - run:
            name: Cloning dependency repositories..
            command: |
               git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
               git clone -b develop --single-branch https://github.com/Zimbra/zm-zcs.git ~/zm-zcs
               git clone -b master --single-branch https://github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
               git clone -b develop --single-branch https://github.com/Zimbra/zm-mailbox.git ~/zm-mailbox
               mkdir -p ~/.zcs-deps

         - persist_to_workspace:
            root: ..
            paths:
               - zm-taglib
               - zm-pkg-tool
               - zm-zcs
               - zimbra-package-stub
               - zm-mailbox
               - .zcs-deps

############################################################################

   build_job_steps: &build_job_steps
      steps:
         - attach_workspace:
            at: ..

         - run:
            name: Compiling required dependencies and creating artifacts
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update && sudo apt-get install ant-contrib -y

              VERSION="${BUILD_RELEASE_NO}_${CIRCLE_BUILD_NUM}"

              MAJOR_VERSION=$(echo "$BUILD_RELEASE_NO" | cut -d'.' -f1)
              MINOR_VERSION=$(echo "$BUILD_RELEASE_NO" | cut -d'.' -f2)
              MICRO_TAG=$(echo "$BUILD_RELEASE_NO" | cut -d'.' -f3 | cut -d'_' -f1)

              echo "VERSION=$VERSION"
              echo "MAJOR=$MAJOR_VERSION MINOR=$MINOR_VERSION MICRO=$MICRO_TAG"

              run_ant() {
                JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 && export JAVA_HOME && \
                ant \
                  -Dzimbra.buildinfo.version="$VERSION" \
                  -Dzimbra.buildinfo.majorversion="$MAJOR_VERSION" \
                  -Dzimbra.buildinfo.minorversion="$MINOR_VERSION" \
                  -Dzimbra.buildinfo.microtag="$MICRO_TAG" "$@"
              }

              cd ../zm-mailbox/
              run_ant clean publish-local-all

              cd ../zm-taglib
              run_ant clean publish-local

         - persist_to_workspace:
            root: ..
            paths:
               - zm-taglib/build
               - .zcs-deps

############################################################################

   publish_job_steps: &publish_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Publishing artifacts to Nexus Artifactory
            command: |
              sudo apt-get update && sudo apt-get install ant-contrib -y

              VERSION="${BUILD_RELEASE_NO}_${CIRCLE_BUILD_NUM}"

              MAJOR_VERSION=$(echo "$BUILD_RELEASE_NO" | cut -d'.' -f1)
              MINOR_VERSION=$(echo "$BUILD_RELEASE_NO" | cut -d'.' -f2)
              MICRO_TAG=$(echo "$BUILD_RELEASE_NO" | cut -d'.' -f3 | cut -d'_' -f1)

              echo "Publishing VERSION=$VERSION"

              run_ant() {
                JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 && export JAVA_HOME && \
                ant \
                  -Dzimbra.buildinfo.version="$VERSION" \
                  -Dzimbra.buildinfo.majorversion="$MAJOR_VERSION" \
                  -Dzimbra.buildinfo.minorversion="$MINOR_VERSION" \
                  -Dzimbra.buildinfo.microtag="$MICRO_TAG" "$@"
              }

              cd ../zm-taglib
              run_ant publish-remote

############################################################################

jobs:
   checkout:
      working_directory: ~/zm-taglib
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *checkout_job_steps

   build:
      working_directory: ~/zm-taglib
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps

   publish:
      working_directory: ~/zm-taglib
      shell: /bin/bash -eo pipefail
      circleci_ip_ranges: true
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *publish_job_steps

   trigger_zm_admin_console:
      docker:
         - image: cimg/base:2024.01
      resource_class: small
      steps:
         - run:
            name: Trigger zm-admin-console pipeline (ZCS-19027 downstream)
            command: |
               set -euo pipefail
               : "${DOWNSTREAM_CIRCLECI_TOKEN:?DOWNSTREAM_CIRCLECI_TOKEN must be set (e.g. circleci-downstream-trigger context)}"
               SLUG="${DOWNSTREAM_PROJECT_SLUG:-gh/Zimbra/zm-admin-console}"
               BRANCH="${DOWNSTREAM_BRANCH:-develop}"
               echo "Triggering pipeline project=${SLUG} branch=${BRANCH}"
               curl -fSs -X POST "https://circleci.com/api/v2/project/${SLUG}/pipeline" \
                 -H "Circle-Token: ${DOWNSTREAM_CIRCLECI_TOKEN}" \
                 -H "Content-Type: application/json" \
                 -d "{\"branch\":\"${BRANCH}\"}"

############################################################################

workflows:
   version: 2
   main:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
         - build:
            context:
               - build-info
               - docker-dev-registry
            requires:
               - checkout
         - publish:
            context:
               - docker-dev-registry
               - build-info
               - nexus-dev-artifactory
            requires:
               - build
            filters:
               branches:
                 only:
                   - develop
         - trigger_zm_admin_console:
            context:
               - circleci-downstream-trigger
            requires:
               - publish
            filters:
               branches:
                 only:
                   - develop
         # Same branch as main: after build (no publish on ZCS-19027). Avoid a separate workflow
         # with no "requires", which would fire the trigger in parallel with checkout/build.
         - trigger_zm_admin_console:
            name: trigger_zm_admin_console_after_build_zcs19027
            context:
               - circleci-downstream-trigger
            requires:
               - build
            filters:
               branches:
                 only:
                   - ZCS-19027
